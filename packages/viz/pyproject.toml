[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engg-math-viz"
version = "0.1.0"
description = "Terminal rendering for the Engineering Mathematics ecosystem: theme, panels, JSON output, LaTeX via txm"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Engineering Mathematics" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["engg-math-core>=0.1,<0.2", "rich>=13.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/engg_math"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
