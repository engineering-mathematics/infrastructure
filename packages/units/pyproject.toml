[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engg-math-units"
version = "0.1.0"
description = "Shared unit registry and dimensional checking for the Engineering Mathematics ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Engineering Mathematics" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["engg-math-core>=0.1,<0.2", "pint>=0.24.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/engg_math"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
